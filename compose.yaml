services:
  event-downloader:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: ${IMAGE:-himilou/luckypythontasks:Prod1-1}
    env_file:
      - .env
    volumes:
      - lucky_rails_public_assets:/event_img
    restart: "no"

volumes:
  lucky_rails_public_assets:
    external: true
    name: lucky_rails_public_assets
