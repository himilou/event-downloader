type: Microsoft.App/jobs
properties:
  environmentId: /subscriptions/24738afd-7c58-43fb-a685-c5e3a0dfbee7/resourceGroups/luckyliquor/providers/Microsoft.App/managedEnvironments/luckyliquor-env
  configuration:
    triggerType: Schedule
    replicaTimeout: 1800
    replicaRetryLimit: 1
    secrets:
      - name: drive-api-key
        value: bootstrap-placeholder # Replaced from .env by container_app_job.sh
    scheduleTriggerConfig:
      cronExpression: "0 */6 * * *"  # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
      parallelism: 1
      replicaCompletionCount: 1
  template:
    containers:
      - name: python-container
        image: himilou/luckypythontasks:Prod1-1
        command: ["python", "/app/event_downloader.py"]
        env:
          - name: GOOGLE_DRIVE_API_KEY
            secretRef: drive-api-key #loaded in container_app_job.sh from .env file
          - name: GOOGLE_DRIVE_FOLDER_ID
            value: "1fS_IYqKFABFkozIT6JPtqikZMgqwHL9B"
        resources:
          cpu: 0.25
          memory: 0.5Gi
        volumeMounts:
          - volumeName: event-image-volume
            mountPath: /event_img              # Rails.root/public/event_img
    volumes:
      - name: event-image-volume
        storageName: luckyliquor-file-mount   # the SMB file share name from Azure
        storageType: AzureFile
